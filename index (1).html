const YN = [[0,"No"],[1,"Yes"]];
const AGE = [[1,"18-24"],[2,"25-29"],[3,"30-34"],[4,"35-39"],[5,"40-44"],[6,"45-49"],[7,"50-54"],[8,"55-59"],[9,"60-64"],[10,"65-69"],[11,"70-74"],[12,"75-79"],[13,"80 or older"]];
const EDU = [[1,"Never attended / kindergarten only"],[2,"Elementary"],[3,"Some high school"],[4,"High school graduate"],[5,"Some college / technical school"],[6,"College graduate"]];
const INC = [[1,"Under $10,000"],[2,"$10,000 - $15,000"],[3,"$15,000 - $20,000"],[4,"$20,000 - $25,000"],[5,"$25,000 - $35,000"],[6,"$35,000 - $50,000"],[7,"$50,000 - $75,000"],[8,"$75,000 or more"]];
const GEN = [[1,"1 - Excellent"],[2,"2 - Very good"],[3,"3 - Good"],[4,"4 - Fair"],[5,"5 - Poor"]];
// name: [label, "number", min, max, default]  or  [label, options]
const FIELDS = {
  HighBP:["High blood pressure",YN],
  HighChol:["High cholesterol",YN],
  CholCheck:["Cholesterol check in last 5 years",YN],
  BMI:["Body Mass Index (BMI)","number",12,98,27],
  Smoker:["Smoked at least 100 cigarettes in lifetime",YN],
  Stroke:["Ever had a stroke",YN],
  HeartDiseaseorAttack:["Coronary heart disease or heart attack",YN],
  PhysActivity:["Physical activity in last 30 days",YN],
  Fruits:["Eats fruit daily",YN],
  Veggies:["Eats vegetables daily",YN],
  HvyAlcoholConsump:["Heavy drinker (14+ drinks/week men, 7+ women)",YN],
  AnyHealthcare:["Has any health coverage",YN],
  NoDocbcCost:["Skipped a doctor visit because of cost",YN],
  GenHlth:["General health",GEN],
  MentHlth:["Days of poor mental health (last 30)","number",0,30,0],
  PhysHlth:["Days of poor physical health (last 30)","number",0,30,0],
  DiffWalk:["Serious difficulty walking or climbing stairs",YN],
  Sex:["Sex",[[0,"Female"],[1,"Male"]]],
  Age:["Age group",AGE],
  Education:["Education",EDU],
  Income:["Annual household income",INC]
};
const DEFAULTS = {CholCheck:1,PhysActivity:1,Fruits:1,Veggies:1,AnyHealthcare:1,GenHlth:3,Age:7,Education:5,Income:6};

const box = document.getElementById("fields");
const names = MODEL ? MODEL.features : Object.keys(FIELDS);
names.forEach(n=>{
  const d = FIELDS[n]; if(!d) return;
  const w = document.createElement("div");
  let h = `<label for="${n}">${d[0]}</label>`;
  if(d[1]==="number") h += `<input id="${n}" type="number" min="${d[2]}" max="${d[3]}" step="any" value="${d[4]}" required>`;
  else h += `<select id="${n}">` + d[1].map(([v,t])=>`<option value="${v}"${(DEFAULTS[n]??0)==v?" selected":""}>${t}</option>`).join("") + `</select>`;
  w.innerHTML = h; box.appendChild(w);
});

function forward(x){
  let a = x;
  for(const L of MODEL.layers){
    const out = L.bias.map((b,j)=>{ let s=b; for(let i=0;i<a.length;i++) s+=a[i]*L.kernel[i][j]; return s; });
    if(L.activation==="relu") a = out.map(v=>Math.max(0,v));
    else if(L.activation==="sigmoid") a = out.map(v=>1/(1+Math.exp(-v)));
    else a = out;
  }
  return a;
}
function predict(values){
  const z = MODEL.features.map((n,i)=>(values[n]-MODEL.mean[i])/MODEL.scale[i]);
  return forward(z)[0];
}
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent="";
  if(!MODEL){ err.textContent="No model embedded. Run the notebook's website cell to generate index.html."; return; }
  const v = {}; MODEL.features.forEach(n=>v[n]=parseFloat(document.getElementById(n).value));
  const p = predict(v), thr = MODEL.threshold ?? 0.5, high = p>=thr;
  document.getElementById("result").style.display="block";
  const lab = document.getElementById("label");
  lab.textContent = high ? "Higher diabetes risk" : "Lower diabetes risk";
  lab.style.color = high ? "var(--bad)" : "var(--good)";
  const fill = document.getElementById("fill");
  fill.style.width = (p*100).toFixed(1)+"%"; fill.style.background = high ? "var(--bad)" : "var(--good)";
  document.getElementById("prob").textContent = `Model probability: ${(p*100).toFixed(1)}% (decision threshold ${(thr*100).toFixed(0)}%)`;
});
if(typeof module!=="undefined") module.exports={predict,forward};
